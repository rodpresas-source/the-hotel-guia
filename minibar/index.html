<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minibar · The Hotel</title>
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
:root{--vp:#173f35;--ve:#205c40;--lj:#ff6720;--cr:#e9e5cd;--pr:#2b2926}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cr);color:var(--pr);font-family:Montserrat,Arial,sans-serif;-webkit-text-size-adjust:100%}
.top{background:var(--vp);color:var(--cr);position:relative;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;max-width:680px;margin:0 auto;position:relative;z-index:2}
.sw{display:flex;gap:4px}
.sw button{font:500 12px/1 Montserrat,Arial,sans-serif;letter-spacing:.12em;color:var(--cr);background:transparent;border:1px solid rgba(233,229,205,.45);border-radius:999px;padding:9px 12px;min-width:44px;min-height:36px;cursor:pointer}
.sw button[aria-pressed=true]{background:var(--cr);color:var(--vp);border-color:var(--cr)}
.leaf{position:absolute;right:-30px;top:84px;width:190px;height:auto;transform:rotate(-18deg);z-index:1}
.hw{max-width:680px;margin:0 auto;padding:10px 22px 40px;position:relative;z-index:2}
.kicker{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:52px;line-height:.98;margin:14px 0 16px}
h1 em{font-style:italic}
.intro{font-size:15px;line-height:1.55;margin:0;max-width:30ch}
main{max-width:680px;margin:0 auto;padding:6px 22px 48px}
section{padding:26px 0 6px;border-bottom:1px solid rgba(23,63,53,.18)}
.num{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--lj)}
h2{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:30px;color:var(--vp);margin:6px 0 10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-top:1px solid rgba(23,63,53,.1)}
li:first-child{border-top:0}
.n strong{display:block;font-weight:700;font-size:16px;color:var(--vp)}
.n span{display:block;font-size:14px;margin-top:3px}
.p{font-family:'Playfair Display',Georgia,serif;font-size:22px;color:var(--vp);white-space:nowrap}
.note{font-size:14px;line-height:1.55;margin:26px 0 0;color:var(--ve)}
.help{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:20px;line-height:1.35;color:var(--vp);margin:22px 0 0}
footer{max-width:680px;margin:0 auto;padding:0 22px 40px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--ve)}
@media (min-width:600px){h1{font-size:68px} .leaf{right:calc(50% - 360px);width:230px}}
</style>
</head>
